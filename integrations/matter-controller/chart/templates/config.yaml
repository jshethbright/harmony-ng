apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-source
data:
{{- range $path, $_ := .Files.Glob "app/**" }}
  {{ $path | trimPrefix "app/" | replace "/" "_" | quote }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mosquitto
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous false
    password_file /data/mosquitto/passwordfile
    persistence true
    persistence_location /data/mosquitto/
    log_dest stdout
    log_type error
    log_type warning
