apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}-ui}
  ports:
    - {name: http, port: {{ .Values.port }}, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mqtt
spec:
  selector: {app: {{ .Release.Name }}}
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt}
